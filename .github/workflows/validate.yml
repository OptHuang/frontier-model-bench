name: Validate benchmark data

on:
  push:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JSON contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data
        run: |
          python scripts/build_derived.py
          python scripts/validate_data.py --strict

      - name: Test source adapters
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check static page scripts
        run: |
          node --check app.js
          node --check benchmarks.js
          node --check models.js
